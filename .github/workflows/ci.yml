name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: karsenz
          POSTGRES_USER: karsenz
          POSTGRES_PASSWORD: karsenz_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karsenz -d karsenz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @karsenz/api prisma migrate deploy
        env:
          DATABASE_URL: postgresql://karsenz:karsenz_dev_password@localhost:5432/karsenz?schema=public
      - run: pnpm lint && pnpm type-check && pnpm test && pnpm build
